<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="text-align: center;">
    <h1 style="text-align: center; background-color: plum;"> RETURN BOOK</h1>
    <hr><br><br>

    {% if messages %}
        {% for msg in messages %}
            <h2>{{ msg }}</h2>
        {% endfor %}
    {% endif %}

    <div style="text-align: center; font-size: 20px;">
    <form method="post">
        {% csrf_token %}

    BOOK ID: <input type="number" name="id" placeholder="Enter Book ID" required><br><br><br>

    <button type="submit" style="text-align: center; background-color: honeydew; height: 30px; width: 140px;">RETURN BOOK</button><br><br>

    </form><br>

    <a href="{% url 'search' %}">Back To Search Page</a><br><br>
    <a href="{% url 'home' %}">Back To Home Page</a><br><br>
    </div><br>



</body>
</html>
