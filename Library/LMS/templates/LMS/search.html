<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="text-align: center;">
    
    <h1 style="text-align: center; background-color: lavender;">SEARCH RECORD</h1>
    <hr>
    <br><br>

 <div style="text-align: center; font-size: 25px;">

    <form method="post">
        {% csrf_token %}

    BOOK ID: <input type="number"name="id" placeholder="Enter ID"><br><br>

    <button type="submit" name="action" value="search" style="text-align: center; background-color: aquamarine; height:30px; width:140px;">SEARCH</button><br><br>

    <button type="submit" name="action" value="search_all" style="text-align: center; background-color: aquamarine; height: 30px; width:140px;">SEARCH_ALL</button><br>

    </form>
    <p> {{ message }} </p>
    
    
<div style="text-align: center;">

    {% if books %}
    <table border="2" style="margin: auto;">
        <tr>
            <th>BooK_id</th>
            <th>Book_name</th>
            <th>Book_author</th>
            <th>Book_status</th>
        </tr>
        {% for b in books%}
        <tr>
            <td>{{ b.id }}</td>
            <td>{{ b.name }}</td>
            <td>{{ b.author }}</td>
            <td>{{ b.status }}</td>
        </tr>
        {% endfor %}
    </table>
    {% endif %}
</div> <br> <br>

    <a href="{% url 'home' %}" style="text-align: center;">Back To Home Page</a>
    
</div>
 

</body>
</html>
